name: Validar feeds

on:
  push:
    paths:
      - 'data/**'
      - 'automation/**'
      - 'js/fact-check/**'
      - 'tests/fact-check/**'
      - 'tests/organize/**'
  pull_request:
    paths:
      - 'data/**'
      - 'automation/**'
      - 'js/fact-check/**'
      - 'tests/fact-check/**'
      - 'tests/organize/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node automation/validate.js
      - run: node tests/fact-check/link.test.js
      - run: node tests/fact-check/media.test.js
      - run: node tests/fact-check/text.test.js
      - run: node tests/organize/fetch.test.js
