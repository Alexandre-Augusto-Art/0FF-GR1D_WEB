name: Fact Check - checagens das agências

# Lê o RSS das agências de checagem e atualiza data/factchecks.json (usado na aba MENSAGEM do Fact Check).
# Roda no GitHub, sem IA e sem depender do PC de casa. Também dá para rodar à mão em Actions > "Run workflow".
on:
  schedule:
    - cron: '23 */6 * * *'   # a cada 6 horas, fora da hora cheia (horários cheios ficam congestionados)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: factchecks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Coletar checagens
        run: node automation/factchecks/fetch.js
      - name: Validar
        run: node automation/validate.js
      - name: Publicar se mudou
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add data/factchecks.json
          if git diff --cached --quiet; then
            echo 'Nada novo.'
            exit 0
          fi
          git commit -m "Fact Check: checagens atualizadas $(date -u +%Y-%m-%d)"
          # os scripts do PC de casa também publicam no main: tenta de novo se alguém empurrou antes
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
