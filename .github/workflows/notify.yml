name: 2B - avisos no Telegram

# Quando sai conteúdo novo em data/ (W4K3, Motivação, Organize-se, Fact Check), a 2B posta no canal do Telegram.
# Push do PC de casa dispara pelo "push"; os commits das outras Actions (feitos com GITHUB_TOKEN) não disparam
# push, por isso o "workflow_run". O que já foi avisado fica no branch notify-state (fora do main, sem conflito).
# Precisa dos secrets TELEGRAM_2B_TOKEN e TELEGRAM_2B_CHAT. Passo a passo: docs/NOTIFICACOES.md
on:
  push:
    branches: [main]
    paths: ['data/**']
  workflow_run:
    workflows: ['Fact Check - checagens das agências', 'Organize-se - atos do dia']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # o workflow_run aponta para o commit de antes da Action publicar; queremos o main atual
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Testes
        run: node tests/notify/notify.test.js
      - name: Estado (o que já foi avisado)
        run: |
          if git fetch --depth=1 origin notify-state 2>/dev/null; then
            git show FETCH_HEAD:notified.json > "$RUNNER_TEMP/notified.json"
          else
            echo 'Primeira vez: sem estado, a 2B só marca o que já existe.'
          fi
      - name: Avisar
        env:
          TELEGRAM_2B_TOKEN: ${{ secrets.TELEGRAM_2B_TOKEN }}
          TELEGRAM_2B_CHAT: ${{ secrets.TELEGRAM_2B_CHAT }}
        run: node automation/notify.js --state "$RUNNER_TEMP/notified.json"
      - name: Guardar estado
        if: always()   # mesmo se um envio falhou: o que foi enviado não pode ir de novo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f "$RUNNER_TEMP/notified.json" ]; then echo 'Sem estado para guardar.'; exit 0; fi
          dir="$(mktemp -d)"
          cp "$RUNNER_TEMP/notified.json" "$dir/"
          cd "$dir"
          git init -q -b notify-state
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add notified.json
          git commit -qm "2B: estado dos avisos $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:notify-state
