<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F4C3 SC4N - teste de paridade</title>
  <style>
    body { background: #1b191c; color: #e0f2fe; font: 14px/1.5 monospace; padding: 16px; }
    table { border-collapse: collapse; width: 100%; margin-top: 12px; }
    th, td { border: 1px solid #444; padding: 4px 8px; text-align: left; vertical-align: top; }
    .ok { color: #00ff84; } .fail { color: #ff4d6d; }
  </style>
</head>
<body>
  <h1>F4C3 SC4N - paridade navegador × Python</h1>
  <p>Compara js/face-scan com o gabarito de <code>make_expected.py</code> em <code>fixtures/</code>.
    Sirva a raiz do site (ex.: <code>python -m http.server 8765</code>) e abra
    <code>/tests/face-scan/parity.html</code>.</p>
  <p id="status">Carregando modelos...</p>
  <table id="report" hidden>
    <thead><tr><th>imagem</th><th>rostos</th><th>pessoas</th><th>identidade</th><th>tempo</th><th>resultado</th></tr></thead>
    <tbody></tbody>
  </table>

  <script src="../../js/face-scan/client.js"></script>
  <script>
    'use strict';
    const BOX_IOU = 0.85;   // caixa do navegador × caixa do Python
    const SIM_TOL = 0.05;   // diferença tolerada na semelhança de identidade
    const FIXTURES = 'fixtures/';
    const status = document.getElementById('status');

    FaceScan.onProgress(p => {
      status.textContent = `Baixando modelo ${p.stage}: ${Math.round(100 * p.loaded / p.total)}%`;
    });

    function iou(a, b) {
      const x1 = Math.max(a[0], b[0]), y1 = Math.max(a[1], b[1]);
      const x2 = Math.min(a[0] + a[2], b[0] + b[2]), y2 = Math.min(a[1] + a[3], b[1] + b[3]);
      const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
      return inter / (a[2] * a[3] + b[2] * b[3] - inter);
    }

    // Para cada caixa esperada, a melhor IoU entre as caixas encontradas.
    function matchBoxes(expected, got) {
      return expected.map(e => Math.max(0, ...got.map(g => iou(e.box, g.box))));
    }

    async function analyzeUrl(url) {
      const blob = await (await fetch(url)).blob();
      return FaceScan.analyze(blob);
    }

    async function run() {
      const res = await fetch(FIXTURES + 'expected.json');
      if (!res.ok) throw new Error('Sem fixtures/expected.json: rode make_expected.py primeiro.');
      const expected = await res.json();

      const refResult = await analyzeUrl(FIXTURES + expected.reference.image);
      const refFace = refResult.faces.reduce((best, f) =>
        !best || iou(f.box, expected.reference.box) > iou(best.box, expected.reference.box) ? f : best, null);
      if (!refFace) throw new Error('Nenhum rosto na imagem de referência.');

      const rows = [];
      for (const [name, exp] of Object.entries(expected.images)) {
        status.textContent = `Analisando ${name}...`;
        const got = await analyzeUrl(FIXTURES + name);
        const faceIous = matchBoxes(exp.faces, got.faces);
        const personIous = matchBoxes(exp.people, got.people);
        const sims = got.faces.map(f => FaceScan.compare(f.embedding, refFace.embedding));
        const best = sims.length ? Math.max(...sims) : null;

        const checks = {
          faceCount: got.faces.length === exp.faces.length,
          faceBoxes: faceIous.every(v => v >= BOX_IOU),
          personCount: got.people.length === exp.people.length,
          personBoxes: personIous.every(v => v >= BOX_IOU),
          similarity: best === null ? exp.best_similarity === null
            : exp.best_similarity !== null && Math.abs(best - exp.best_similarity) <= SIM_TOL,
          recognized: (best !== null && best >= FaceScan.MATCH) === exp.recognized
        };
        rows.push({
          name,
          faces: `${got.faces.length} / ${exp.faces.length} (IoU min ${faceIous.length ? Math.min(...faceIous).toFixed(2) : '-'})`,
          people: `${got.people.length} / ${exp.people.length} (IoU min ${personIous.length ? Math.min(...personIous).toFixed(2) : '-'})`,
          sim: `${best === null ? '-' : best.toFixed(3)} / ${exp.best_similarity === null ? '-' : exp.best_similarity.toFixed(3)}`,
          ms: got.elapsedMs,
          failed: Object.keys(checks).filter(k => !checks[k])
        });
      }
      return rows;
    }

    run().then(rows => {
      const tbody = document.querySelector('#report tbody');
      for (const r of rows) {
        const tr = document.createElement('tr');
        const verdict = r.failed.length ? `<span class="fail">FALHOU: ${r.failed.join(', ')}</span>` : '<span class="ok">OK</span>';
        tr.innerHTML = `<td>${r.name}</td><td>${r.faces}</td><td>${r.people}</td><td>${r.sim}</td><td>${r.ms} ms</td><td>${verdict}</td>`;
        tbody.appendChild(tr);
      }
      document.getElementById('report').hidden = false;
      const passed = rows.every(r => !r.failed.length);
      status.innerHTML = passed ? '<span class="ok">PARIDADE OK</span>' : '<span class="fail">PARIDADE FALHOU</span>';
      window.parityResult = { passed, rows };
    }).catch(err => {
      status.innerHTML = `<span class="fail">ERRO: ${err.message}</span>`;
      window.parityResult = { passed: false, error: err.message };
    });
  </script>
</body>
</html>
